<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBuddy — AI Assistant</title>
    <meta name="description" content="SmartBuddy: Your AI assistant for writing, research and coding." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
      #root { width: 100%; max-width: 1000px; }

      /* Design tokens */
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-mono: 'Fira Code', 'Cascadia Code', monospace;
        --radius: 6px;

        --surface-0: #0f1117;
        --surface-1: #161b22;
        --surface-2: #1c2128;

        --border: #30363d;
        --border-strong: #484f58;
        --border-accent: #388bfd;
        --border-success: #2ea043;
        --border-warning: #d29922;
        --border-danger: #da3633;

        --text-primary: #e6edf3;
        --text-secondary: #8b949e;
        --text-muted: #6e7681;
        --text-accent: #79c0ff;
        --text-success: #56d364;
        --text-warning: #e3b341;
        --text-danger: #ff7b72;
        --text-pro: #d2a8ff;

        --fill-accent: #1f6feb;
        --fill-success: #238636;
        --fill-danger: #da3633;
        --fill-warning: #d29922;
        --on-accent: #ffffff;

        --bg-accent: #0d419d22;
        --bg-success: #23863622;
        --bg-warning: #d2992222;
        --bg-danger: #da363322;
        --bg-pro: #8957e522;

        --text-pro: #d2a8ff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
