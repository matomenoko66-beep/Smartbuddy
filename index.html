<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartBuddy — AI Assistant</title>
  <meta name="description" content="SmartBuddy: Your AI assistant for writing, research and coding."/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#0f1117}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:12px}
    #root{width:100%;max-width:1020px}
    :root{
      --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      --font-mono:'Fira Code','Cascadia Code',monospace;
      --radius:6px;
      --surface-0:#0f1117;--surface-1:#161b22;--surface-2:#1c2128;
      --border:#30363d;--border-strong:#484f58;
      --border-accent:#388bfd;--border-success:#2ea043;--border-warning:#d29922;--border-danger:#da3633;
      --text-primary:#e6edf3;--text-secondary:#8b949e;--text-muted:#6e7681;
      --text-accent:#79c0ff;--text-success:#56d364;--text-warning:#e3b341;--text-danger:#ff7b72;--text-pro:#d2a8ff;
      --fill-accent:#1f6feb;--fill-success:#238636;--fill-danger:#da3633;--fill-warning:#d29922;--on-accent:#fff;
      --bg-accent:#0d419d22;--bg-success:#23863622;--bg-warning:#d2992222;--bg-danger:#da363322;--bg-pro:#8957e522;
    }
    @keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const PLANS = {
  free:   { name:"Free",        zar:"R0",  usd:"$0"   },
  pro:    { name:"Pro Monthly", zar:"R46", usd:"$2.50" },
  annual: { name:"Pro Annual",  zar:"R33", usd:"$1.80" },
};

const MODES = {
  writing: { label:"Writing",  icon:"✏️",  sugs:["Help me write an email","Improve this paragraph","Write a cover letter","Summarize this text"],   sys:"You are SmartBuddy, a professional AI writing assistant. Help users write, edit, and improve text. Be concise and practical. Keep responses under 150 words unless writing a full document." },
  research:{ label:"Research", icon:"🔍",  sugs:["Explain machine learning","Compare React vs Vue","What is blockchain?","Latest AI trends 2026"],       sys:"You are SmartBuddy, a professional AI research assistant. Help users research topics and understand complex subjects. Be clear, factual, and organized. Keep responses under 150 words." },
  coding:  { label:"Coding",   icon:"💻",  sugs:["Debug this code","Write a Python function","Explain async/await","Review my code"],                   sys:"You are SmartBuddy, a professional AI coding assistant. Help users write, debug, and review code. Use code blocks for snippets. Be precise. Keep responses under 150 words unless writing code." },
};

const FREE_SECS = 2*60*60;
const FREE_FILES = 10;

function fmt(s){ if(s<=0)return"Time up"; const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60; if(h>0)return`${h}h ${m}m left`; if(m>0)return`${m}m ${sc}s left`; return`${sc}s left`; }

function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2400);return()=>clearTimeout(t);},[]);
  const C={ok:"#166534",info:"#1e40af",warn:"#92400e",danger:"#991b1b"};
  const B={ok:"#dcfce7",info:"#dbeafe",warn:"#fef3c7",danger:"#fee2e2"};
  return <div style={{position:"absolute",bottom:16,left:"50%",transform:"translateX(-50%)",padding:"6px 16px",borderRadius:20,fontSize:12,whiteSpace:"nowrap",zIndex:99,background:B[type]||B.info,color:C[type]||C.info,border:`1px solid ${C[type]||C.info}44`,pointerEvents:"none"}}>{msg}</div>;
}

function Bar({label,used,total,color}){
  const pct=Math.max(0,Math.min(100,Math.round(((total-used)/total)*100)));
  const low=pct<20;
  return <div style={{marginBottom:6}}>
    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"var(--text-secondary)",marginBottom:3}}>
      <span>{label}</span>
      <span style={{fontWeight:500,color:low?"var(--text-danger)":"var(--text-primary)"}}>{total-used}/{total} left</span>
    </div>
    <div style={{height:4,background:"var(--surface-0)",borderRadius:4,overflow:"hidden"}}>
      <div style={{height:"100%",width:`${pct}%`,background:low?"var(--fill-danger)":color||"var(--fill-accent)",borderRadius:4,transition:"width .5s"}}/>
    </div>
  </div>;
}

function App(){
  const [view,setView]=useState("chat");
  const [mode,setMode]=useState("writing");
  const [plan,setPlan]=useState("free");
  const [msgs,setMsgs]=useState([]);
  const [conv,setConv]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const [web,setWeb]=useState(false);
  const [customPrompt,setCustomPrompt]=useState("");
  const [presetIdx,setPresetIdx]=useState(0);
  const [history,setHistory]=useState([]);
  const [fileContent,setFileContent]=useState(null);
  const [fileName,setFileName]=useState(null);
  const [filesUsed,setFilesUsed]=useState(0);
  const [timeUsed,setTimeUsed]=useState(0);
  const [active,setActive]=useState(false);
  const [toast,setToast]=useState(null);
  const [notifs,setNotifs]=useState([
    {id:1,icon:"🌐",title:"Web search available",desc:"Toggle web search in the chat bar. Requires Pro plan.",time:"Just now",read:false},
    {id:2,icon:"📄",title:"PDF export ready",desc:"Export any chat using the Export PDF button.",time:"2 min ago",read:false},
    {id:3,icon:"⏱️",title:"Free plan: 2 hrs/day",desc:"You have 2 hours of AI access per day. Upgrade for unlimited.",time:"5 min ago",read:false},
    {id:4,icon:"👑",title:"Upgrade to Pro",desc:"R46/month unlocks everything.",time:"1h ago",read:true},
  ]);
  const [unread,setUnread]=useState(3);
  const msgsRef=useRef(null);
  const inpRef=useRef(null);
  const timerRef=useRef(null);
  const fileRef=useRef(null);

  useEffect(()=>{
    if(active&&plan==="free"){
      timerRef.current=setInterval(()=>{
        setTimeUsed(s=>{
          if(s>=FREE_SECS){clearInterval(timerRef.current);setActive(false);showToast("Daily time limit reached — upgrade to Pro","warn");return s;}
          return s+1;
        });
      },1000);
    }
    return()=>clearInterval(timerRef.current);
  },[active,plan]);

  useEffect(()=>{if(msgsRef.current)msgsRef.current.scrollTop=msgsRef.current.scrollHeight;},[msgs,loading]);

  function showToast(msg,type="info"){setToast({msg,type,id:Date.now()});}

  async function send(){
    const text=input.trim();
    if(!text&&!fileContent)return;
    if(plan==="free"&&timeUsed>=FREE_SECS){showToast("Daily limit reached — upgrade to Pro","warn");setView("plans");return;}
    let uContent=text, aContent=text;
    if(fileContent){
      if(plan==="free"&&filesUsed>=FREE_FILES){showToast("File limit reached (10/day) — upgrade to Pro","warn");return;}
      aContent=(text?text+"\n\n":"")+"File: "+fileName+"\n\n"+fileContent.slice(0,3000);
      uContent=(text?text+" · ":"")+"["+fileName+"]";
      setFilesUsed(f=>f+1);
      setFileContent(null);setFileName(null);
    }
    setInput("");
    setMsgs(m=>[...m,{role:"user",content:uContent,mode}]);
    const newConv=[...conv,{role:"user",content:aContent}];
    setConv(newConv);
    setLoading(true);setActive(true);
    const sys=(customPrompt||MODES[mode].sys)+(web?" You have real-time web search access.":"");
    const body={model:"claude-sonnet-4-6",max_tokens:1000,system:sys,messages:newConv};
    if(web)body.tools=[{type:"web_search_20250305",name:"web_search"}];
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data=await res.json();
      const reply=data.content?.filter(b=>b.type==="text").map(b=>b.text).join("")||"Something went wrong.";
      const usedWeb=data.content?.some(b=>b.type==="tool_use");
      setMsgs(m=>[...m,{role:"assistant",content:reply+(usedWeb?"\n\n[Web search used]":""),mode}]);
      setConv(c=>[...c,{role:"assistant",content:reply}]);
    }catch{
      setMsgs(m=>[...m,{role:"assistant",content:"Connection error. Try again.",mode}]);
    }
    setLoading(false);inpRef.current?.focus();
  }

  function newChat(){setMsgs([]);setConv([]);setActive(false);}

  function saveChat(){
    const u=msgs.filter(m=>m.role==="user");
    if(!u.length){showToast("Nothing to save yet","info");return;}
    setHistory(h=>[{id:Date.now(),title:u[0].content.slice(0,40),mode,time:new Date().toLocaleString(),conv:[...conv]},...h].slice(0,20));
    showToast("Chat saved","ok");
  }

  function loadChat(e){
    newChat();setMode(e.mode);setConv(e.conv);
    setMsgs(e.conv.map(m=>({role:m.role,content:m.content,mode:e.mode})));
    setView("chat");
  }

  function exportPDF(){
    if(plan==="free"){showToast("PDF export requires Pro plan","info");setView("plans");return;}
    if(!msgs.length){showToast("No chat to export","info");return;}
    let txt="SmartBuddy Chat Export\n"+"=".repeat(30)+"\nDate: "+new Date().toLocaleString()+"\nMode: "+MODES[mode].label+"\n\n";
    msgs.forEach(m=>{txt+=(m.role==="user"?"You":"SmartBuddy")+": "+m.content+"\n\n";});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"}));
    a.download="smartbuddy-"+Date.now()+".txt";a.click();
    showToast("Chat exported","ok");
  }

  function toggleWeb(){
    if(plan==="free"){showToast("Web search requires Pro plan","info");setView("plans");return;}
    setWeb(w=>!w);showToast(web?"Web search off":"Web search on",web?"info":"ok");
  }

  function handleFile(e){
    const f=e.target.files[0];if(!f)return;
    if(plan==="free"&&filesUsed>=FREE_FILES){showToast("File limit reached (10/day)","warn");return;}
    setFileName(f.name);
    const r=new FileReader();r.onload=ev=>setFileContent(ev.target.result);r.readAsText(f);
    e.target.value="";
  }

  function selectPlan(p){
    if(p===plan)return;
    setPlan(p);setWeb(false);
    const n=PLANS[p].name;
    showToast("Switched to "+n,"ok");
    setNotifs(ns=>[{id:Date.now(),icon:"✅",title:"Plan activated: "+n,desc:"All features are now active.",time:"Just now",read:false},...ns]);
    setUnread(c=>c+1);
  }

  function markRead(id){setNotifs(ns=>ns.map(n=>n.id===id?{...n,read:true}:n));setUnread(c=>Math.max(0,c-1));}
  function markAllRead(){setNotifs(ns=>ns.map(n=>({...n,read:true})));setUnread(0);}

  const presets=[
    ["Default — balanced assistant",""],
    ["Ultra-concise","Be extremely concise. Answer in 1-3 sentences maximum."],
    ["Senior engineer","You are a senior software engineer. Always show code examples and explain your choices."],
    ["Professional editor","You are a professional editor. Focus on clarity, grammar, and tone."],
    ["Step-by-step","Think step by step. Break every problem into numbered steps."],
  ];

  const isFree=plan==="free";
  const timeLeft=FREE_SECS-timeUsed;

  function Bubble({m}){
    const isUser=m.role==="user";
    const parts=m.content.split(/(```[\s\S]*?```)/g);
    return <div style={{padding:"8px 12px",fontSize:13,lineHeight:1.6,background:isUser?"var(--fill-accent)":"var(--surface-2)",color:isUser?"var(--on-accent)":"var(--text-primary)",border:isUser?"none":"0.5px solid var(--border)",borderRadius:isUser?"10px 2px 10px 10px":"2px 10px 10px 10px",maxWidth:"85%",alignSelf:isUser?"flex-end":"flex-start",wordBreak:"break-word"}}>
      {!isUser&&<div style={{fontSize:10,marginBottom:4,display:"inline-flex",alignItems:"center",gap:3,padding:"2px 7px",borderRadius:20,background:m.mode==="coding"?"var(--bg-pro)":m.mode==="research"?"var(--bg-success)":"var(--bg-accent)",color:m.mode==="coding"?"var(--text-pro)":m.mode==="research"?"var(--text-success)":"var(--text-accent)",fontWeight:500}}>{MODES[m.mode]?.label}</div>}
      {parts.map((p,i)=>{
        if(p.startsWith("```")){const code=p.replace(/```\w*\n?/,"").replace(/```$/,"").trim();return <pre key={i} style={{background:"var(--surface-0)",border:"0.5px solid var(--border)",borderRadius:5,padding:"7px 9px",marginTop:7,fontSize:11,fontFamily:"var(--font-mono)",overflowX:"auto",color:"var(--text-primary)",whiteSpace:"pre-wrap"}}>{code}</pre>;}
        if(p==="[Web search used]")return <div key={i} style={{display:"inline-flex",alignItems:"center",gap:4,marginTop:6,fontSize:10,padding:"2px 7px",borderRadius:20,background:"var(--bg-warning)",color:"var(--text-warning)"}}>🌐 Web search used</div>;
        return <span key={i} style={{whiteSpace:"pre-wrap"}}>{p}</span>;
      })}
    </div>;
  }

  const ni=(v)=>({display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:6,cursor:"pointer",fontSize:12,marginBottom:1,color:view===v?"var(--text-accent)":"var(--text-secondary)",background:view===v?"var(--bg-accent)":"transparent"});
  const bsm={display:"flex",alignItems:"center",gap:3,padding:"4px 8px",borderRadius:6,border:"0.5px solid var(--border-strong)",background:"var(--surface-2)",fontSize:11,color:"var(--text-secondary)",cursor:"pointer",whiteSpace:"nowrap"};

  return <div style={{display:"flex",height:680,background:"var(--surface-0)",border:"0.5px solid var(--border)",borderRadius:12,overflow:"hidden",position:"relative"}}>

    {/* SIDEBAR */}
    <div style={{width:210,background:"var(--surface-1)",borderRight:"0.5px solid var(--border)",display:"flex",flexDirection:"column",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"13px 13px 11px",borderBottom:"0.5px solid var(--border)"}}>
        <div style={{width:30,height:30,background:"var(--fill-accent)",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0}}>🧠</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:500,color:"var(--text-primary)"}}>SmartBuddy</div>
          <div style={{fontSize:10,color:"var(--text-muted)"}}>AI Assistant</div>
        </div>
        <span style={{fontSize:9,padding:"2px 6px",borderRadius:10,fontWeight:500,background:isFree?"var(--surface-0)":"var(--bg-accent)",color:isFree?"var(--text-muted)":"var(--text-accent)",border:isFree?"0.5px solid var(--border)":"none",flexShrink:0}}>{PLANS[plan].name.split(" ")[0]}</span>
      </div>

      {isFree&&<div style={{padding:"10px 10px 6px",borderBottom:"0.5px solid var(--border)"}}>
        <Bar label="Daily time" used={timeUsed} total={FREE_SECS}/>
        <div style={{fontSize:10,color:"var(--text-muted)",textAlign:"right",marginTop:-2,marginBottom:6}}>{fmt(timeLeft)}</div>
        <Bar label="File uploads" used={filesUsed} total={FREE_FILES} color="var(--fill-success)"/>
      </div>}

      <div style={{padding:"8px 5px",flex:1,overflowY:"auto"}}>
        <div style={{fontSize:10,color:"var(--text-muted)",padding:"7px 8px 3px",letterSpacing:".06em",textTransform:"uppercase"}}>Workspace</div>
        {[["chat","💬","Chat",0],["history","🕐","History",history.length],["notifs","🔔","Notifications",unread]].map(([v,ic,lb,badge])=>
          <div key={v} style={ni(v)} onClick={()=>setView(v)}>
            <span>{ic}</span><span style={{flex:1}}>{lb}</span>
            {badge>0&&<span style={{fontSize:9,background:v==="notifs"?"var(--bg-danger)":"var(--bg-success)",color:v==="notifs"?"var(--text-danger)":"var(--text-success)",padding:"1px 5px",borderRadius:10}}>{badge}</span>}
          </div>
        )}
        <div style={{fontSize:10,color:"var(--text-muted)",padding:"7px 8px 3px",letterSpacing:".06em",textTransform:"uppercase",marginTop:8}}>Settings</div>
        {[["prompt","⚙️","Prompt editor"],["plans","👑","Subscription"]].map(([v,ic,lb])=>
          <div key={v} style={ni(v)} onClick={()=>setView(v)}><span>{ic}</span><span>{lb}</span></div>
        )}
      </div>

      <div style={{padding:"9px 13px",borderTop:"0.5px solid var(--border)",display:"flex",alignItems:"center",gap:6}}>
        <div style={{width:6,height:6,borderRadius:"50%",background:"var(--fill-success)",flexShrink:0}}/>
        <span style={{fontSize:10,color:"var(--text-muted)"}}>AI online · {PLANS[plan].name}</span>
      </div>
    </div>

    {/* MAIN */}
    <div style={{flex:1,display:"flex",flexDirection:"column",minWidth:0}}>

      {/* TOPBAR */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 14px",borderBottom:"0.5px solid var(--border)",background:"var(--surface-2)",gap:8,flexShrink:0}}>
        <div style={{display:"flex",gap:2,background:"var(--surface-1)",border:"0.5px solid var(--border)",borderRadius:6,padding:2}}>
          {Object.entries(MODES).map(([k,v])=>
            <div key={k} onClick={()=>setMode(k)} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 9px",borderRadius:5,fontSize:11,cursor:"pointer",color:mode===k?"var(--text-primary)":"var(--text-secondary)",background:mode===k?"var(--surface-2)":"transparent"}}>{v.icon} {v.label}</div>
          )}
        </div>
        <div style={{display:"flex",gap:5,alignItems:"center"}}>
          <div style={bsm} onClick={newChat}>＋ New</div>
          <div style={bsm} onClick={saveChat}>🔖 Save</div>
          <div style={{...bsm,color:isFree?"var(--text-muted)":"var(--text-secondary)"}} onClick={exportPDF}>⬇ PDF</div>
          <div style={{...bsm,position:"relative"}} onClick={()=>setView("notifs")}>
            🔔{unread>0&&<span style={{position:"absolute",top:2,right:2,width:6,height:6,borderRadius:"50%",background:"var(--fill-danger)",border:"1.5px solid var(--surface-2)"}}/>}
          </div>
        </div>
      </div>

      {/* CHAT */}
      {view==="chat"&&<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div ref={msgsRef} style={{flex:1,overflowY:"auto",padding:14,display:"flex",flexDirection:"column",gap:12}}>
          {msgs.length===0&&<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:20}}>
            <div style={{fontSize:36}}>🧠</div>
            <div style={{fontSize:15,fontWeight:500,color:"var(--text-primary)"}}>SmartBuddy is ready</div>
            <div style={{fontSize:12,color:"var(--text-secondary)",textAlign:"center"}}>Pick a suggestion or type below</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",justifyContent:"center",maxWidth:400}}>
              {MODES[mode].sugs.map(s=><div key={s} onClick={()=>{setInput(s);inpRef.current?.focus();}} style={{padding:"5px 10px",borderRadius:20,border:"0.5px solid var(--border-accent)",background:"var(--bg-accent)",color:"var(--text-accent)",fontSize:11,cursor:"pointer"}}>{s}</div>)}
            </div>
          </div>}
          {msgs.map((m,i)=><Bubble key={i} m={m}/>)}
          {loading&&<div style={{display:"flex",gap:5,alignItems:"center",padding:"8px 12px",background:"var(--surface-2)",border:"0.5px solid var(--border)",borderRadius:"2px 10px 10px 10px",alignSelf:"flex-start"}}>
            {[0,200,400].map(d=><div key={d} style={{width:5,height:5,borderRadius:"50%",background:"var(--text-muted)",animation:`pulse 1.2s ${d}ms ease-in-out infinite`}}/>)}
          </div>}
        </div>
        <div style={{padding:"9px 14px",borderTop:"0.5px solid var(--border)",background:"var(--surface-2)",flexShrink:0}}>
          {fileName&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"3px 9px",background:"var(--bg-success)",border:"0.5px solid var(--border-success)",borderRadius:6,fontSize:11,color:"var(--text-success)",marginBottom:6}}>
            📎 {fileName}<span onClick={()=>{setFileContent(null);setFileName(null);}} style={{marginLeft:"auto",cursor:"pointer",opacity:.7}}>✕</span>
          </div>}
          <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
            <textarea ref={inpRef} value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
              placeholder={mode==="coding"?"Ask about code...":mode==="research"?"Research a topic...":"Ask SmartBuddy anything..."}
              style={{flex:1,resize:"none",padding:"7px 10px",borderRadius:6,border:"0.5px solid var(--border-strong)",background:"var(--surface-2)",fontSize:12,color:"var(--text-primary)",fontFamily:"var(--font-sans)",lineHeight:1.5,height:36,outline:"none"}}/>
            <input type="file" ref={fileRef} style={{display:"none"}} accept=".txt,.md,.js,.py,.html,.css,.json,.csv" onChange={handleFile}/>
            <div onClick={()=>fileRef.current?.click()} style={{width:32,height:32,borderRadius:6,border:"0.5px solid var(--border-strong)",background:"var(--surface-2)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:15}} title={isFree?`${FREE_FILES-filesUsed} uploads left`:"Upload file"}>📎</div>
            <div onClick={toggleWeb} style={{width:32,height:32,borderRadius:6,border:web?"0.5px solid var(--border-warning)":"0.5px solid var(--border-strong)",background:web?"var(--bg-warning)":"var(--surface-2)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:15}} title={isFree?"Requires Pro":"Toggle web search"}>🌐</div>
            <button onClick={send} disabled={loading||(!input.trim()&&!fileContent)} style={{width:32,height:32,borderRadius:6,background:"var(--fill-accent)",color:"var(--on-accent)",border:"none",cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",opacity:loading?.5:1}}>➤</button>
          </div>
          {isFree&&<div style={{fontSize:10,color:"var(--text-muted)",marginTop:5,display:"flex",justifyContent:"space-between"}}>
            <span>⏱ {fmt(timeLeft)} remaining</span><span>📎 {FREE_FILES-filesUsed}/{FREE_FILES} uploads</span>
          </div>}
        </div>
      </div>}

      {/* HISTORY */}
      {view==="history"&&<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",borderBottom:"0.5px solid var(--border)",flexShrink:0}}>
          <span style={{fontSize:13,fontWeight:500,color:"var(--text-primary)"}}>Chat history</span>
          <div style={{...bsm,color:"var(--text-danger)"}} onClick={()=>setHistory([])}>🗑 Clear all</div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:10}}>
          {history.length===0?<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:8,color:"var(--text-muted)"}}><div style={{fontSize:28}}>🕐</div><div style={{fontSize:12}}>No saved chats yet</div></div>
          :history.map(h=><div key={h.id} onClick={()=>loadChat(h)} style={{padding:"8px 10px",borderRadius:6,border:"0.5px solid var(--border)",background:"var(--surface-2)",marginBottom:6,cursor:"pointer"}}>
            <div style={{fontSize:11,fontWeight:500,color:"var(--text-primary)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{h.title}</div>
            <div style={{fontSize:10,color:"var(--text-muted)",marginTop:2}}>{MODES[h.mode]?.label} · {h.time}</div>
          </div>)}
        </div>
      </div>}

      {/* NOTIFICATIONS */}
      {view==="notifs"&&<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",borderBottom:"0.5px solid var(--border)",flexShrink:0}}>
          <span style={{fontSize:13,fontWeight:500,color:"var(--text-primary)"}}>Notifications</span>
          <div style={bsm} onClick={markAllRead}>✓ Mark all read</div>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:10}}>
          {notifs.map(n=><div key={n.id} onClick={()=>markRead(n.id)} style={{display:"flex",gap:9,padding:"9px 10px",borderRadius:6,border:n.read?"0.5px solid var(--border)":"0.5px solid var(--border-accent)",background:n.read?"var(--surface-2)":"var(--bg-accent)",marginBottom:6,cursor:"default"}}>
            <div style={{width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,background:"var(--surface-1)",flexShrink:0}}>{n.icon}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:11,fontWeight:500,color:n.read?"var(--text-primary)":"var(--text-accent)"}}>{n.title}</div>
              <div style={{fontSize:10,color:"var(--text-secondary)",marginTop:1,lineHeight:1.4}}>{n.desc}</div>
              <div style={{fontSize:10,color:"var(--text-muted)",marginTop:2}}>{n.time}</div>
            </div>
          </div>)}
        </div>
      </div>}

      {/* PLANS */}
      {view==="plans"&&<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",borderBottom:"0.5px solid var(--border)",flexShrink:0}}>
          <span style={{fontSize:13,fontWeight:500,color:"var(--text-primary)"}}>Subscription plans</span>
          <span style={{fontSize:11,color:"var(--text-muted)"}}>Current: {PLANS[plan].name}</span>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:12,display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:10,alignContent:"start"}}>
          {[
            {id:"free",name:"Free",usd:"$0",zar:"R0/month",billing:"No card needed",desc:"Try SmartBuddy with daily limits.",feats:["2 hours AI access per day","10 file uploads per day","Writing, research & coding modes"],locked:["Web search","PDF export","Chat history","Prompt editor"]},
            {id:"pro",name:"Pro Monthly",usd:"$2.50",zar:"≈ R46/month",billing:"Billed monthly",desc:"Unlimited access to all features.",feats:["Unlimited AI access","Unlimited file uploads","All 3 AI modes","Web search (real-time)","PDF export","Full chat history","Prompt editor","Notifications"],locked:[],featured:true},
            {id:"annual",name:"Pro Annual",usd:"$1.80",zar:"≈ R33/month",billing:"Billed R396/yr · save 28%",desc:"All Pro features at a lower rate.",feats:["Everything in Pro Monthly","28% saving vs monthly","Priority support","Early access to new features"],locked:[]},
          ].map(p=><div key={p.id} style={{border:p.featured?"2px solid var(--border-accent)":"0.5px solid var(--border)",borderRadius:10,padding:12,display:"flex",flexDirection:"column",gap:8,background:"var(--surface-2)"}}>
            {p.featured&&<span style={{fontSize:9,background:"var(--bg-accent)",color:"var(--text-accent)",padding:"2px 8px",borderRadius:10,fontWeight:500,display:"inline-block",marginBottom:4,width:"fit-content"}}>Most popular</span>}
            <div>
              <div style={{fontSize:12,fontWeight:500,color:"var(--text-primary)"}}>{p.name}</div>
              <div style={{display:"flex",alignItems:"baseline",gap:3,margin:"3px 0 1px"}}><span style={{fontSize:20,fontWeight:500,color:"var(--text-primary)"}}>{p.usd}</span><span style={{fontSize:10,color:"var(--text-muted)"}}>/mo</span></div>
              <div style={{fontSize:11,color:"var(--text-secondary)",marginBottom:2}}>{p.zar}</div>
              <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:4}}>{p.billing}</div>
              <div style={{fontSize:10,color:"var(--text-secondary)",lineHeight:1.4}}>{p.desc}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:4,flex:1}}>
              {p.feats.map(f=><div key={f} style={{display:"flex",alignItems:"flex-start",gap:5,fontSize:10,color:"var(--text-secondary)",lineHeight:1.4}}><span style={{color:"var(--fill-success)",flexShrink:0}}>✓</span>{f}</div>)}
              {(p.locked||[]).map(f=><div key={f} style={{display:"flex",alignItems:"flex-start",gap:5,fontSize:10,color:"var(--text-muted)",lineHeight:1.4}}><span style={{flexShrink:0}}>✕</span>{f}</div>)}
            </div>
            <button onClick={()=>selectPlan(p.id)} style={{width:"100%",padding:7,borderRadius:6,fontSize:11,cursor:p.id===plan?"default":"pointer",fontFamily:"var(--font-sans)",border:p.id===plan?"0.5px solid var(--border)":p.featured?"none":"0.5px solid var(--border-strong)",background:p.id===plan?"var(--surface-0)":p.featured?"var(--fill-accent)":"var(--surface-1)",color:p.id===plan?"var(--text-muted)":p.featured?"var(--on-accent)":"var(--text-primary)",marginTop:4}}>
              {p.id===plan?"Current plan":p.id==="free"?"Free plan":p.id==="pro"?"Get Pro — R46/mo":"Get Annual — R396/yr"}
            </button>
          </div>)}
        </div>
        <div style={{textAlign:"center",fontSize:11,color:"var(--text-muted)",padding:"8px 0 12px"}}>One subscription = full access. <span style={{color:"var(--text-accent)",fontWeight:500}}>No upsells. Cancel anytime.</span></div>
      </div>}

      {/* PROMPT EDITOR */}
      {view==="prompt"&&<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"11px 14px",borderBottom:"0.5px solid var(--border)",flexShrink:0}}>
          <span style={{fontSize:13,fontWeight:500,color:"var(--text-primary)"}}>Prompt editor</span>
          <span style={{fontSize:11,color:"var(--text-muted)"}}>Customize AI behavior</span>
        </div>
        <div style={{flex:1,overflowY:"auto",padding:14}}>
          <div style={{fontSize:10,color:"var(--text-muted)",marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>Presets</div>
          {presets.map(([lb,pr],i)=><div key={i} onClick={()=>{setPresetIdx(i);setCustomPrompt(pr);showToast("Preset applied","ok");}} style={{padding:"7px 10px",borderRadius:6,border:presetIdx===i?"0.5px solid var(--border-accent)":"0.5px solid var(--border)",background:presetIdx===i?"var(--bg-accent)":"var(--surface-2)",color:presetIdx===i?"var(--text-accent)":"var(--text-secondary)",fontSize:11,cursor:"pointer",marginBottom:5}}>{lb}</div>)}
          <div style={{fontSize:10,color:"var(--text-muted)",margin:"14px 0 6px",textTransform:"uppercase",letterSpacing:".05em"}}>Custom prompt</div>
          <textarea value={customPrompt} onChange={e=>setCustomPrompt(e.target.value)} placeholder="Write a custom system prompt..." style={{width:"100%",resize:"vertical",padding:"8px 10px",borderRadius:6,border:"0.5px solid var(--border-strong)",background:"var(--surface-2)",fontSize:11,color:"var(--text-primary)",fontFamily:"var(--font-sans)",lineHeight:1.5,minHeight:90,outline:"none"}}/>
          <button onClick={()=>{setPresetIdx(-1);showToast("Prompt applied","ok");}} style={{width:"100%",padding:8,borderRadius:6,background:"var(--fill-accent)",color:"var(--on-accent)",border:"none",fontSize:12,cursor:"pointer",fontFamily:"var(--font-sans)",marginTop:8}}>Apply prompt</button>
        </div>
      </div>}

    </div>

    {toast&&<Toast key={toast.id} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
